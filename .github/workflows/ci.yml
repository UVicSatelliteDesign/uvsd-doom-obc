# =============================================================================
# .github/workflows/ci.yml
# UVSD DOOM OBC — Continuous Integration
# =============================================================================
#
# Triggers
# --------
#   • Every pull request targeting main or develop
#   • Every push to main or develop (keeps the badge green on merges)
#
# Jobs
# ----
#   unit-tests   — builds and runs the host-based Unity test suite
#   lint         — runs cppcheck static analysis on Core/Src and Core/Inc
#
# =============================================================================

name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:

  # ── Host-based unit tests ──────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc make

      - name: Build and run unit tests
        working-directory: tests
        run: make all

      # Upload the build artefacts on failure so you can inspect them
      - name: Upload test artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-build-failure
          path: tests/build/
          retention-days: 7

  # ── Static analysis ────────────────────────────────────────────────────────
  lint:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cppcheck

      # Only analyse hand-written code in Core/; generated Drivers/Middlewares
      # are excluded because they're not committed (see .gitignore).
      #
      # Core/Src also holds STM32CubeMX/CubeIDE output (main.c, freertos.c,
      # stm32h7xx_*.c, syscalls.c, ...), recognised by its USER CODE markers or
      # ST copyright header. CubeMX rewrites everything outside USER CODE blocks
      # on each regeneration and HAL callback signatures are fixed, so style
      # findings there can't be fixed for good. Those files are still checked
      # for bugs (warning, performance, portability); hand-written files get
      # style checks too.
      - name: Run cppcheck
        run: |
          generated_marker='USER CODE BEGIN|Copyright \(c\) .*STMicroelectronics'
          mapfile -t handwritten < <(grep -LE "$generated_marker" Core/Src/*.c)
          mapfile -t generated   < <(grep -lE "$generated_marker" Core/Src/*.c)
          common=(
            --error-exitcode=1
            --inline-suppr
            --std=c11
            --suppress=missingIncludeSystem
            --suppress=missingInclude
            --suppress=toomanyconfigs
            -I Core/Inc
          )

          status=0
          echo "::group::Hand-written: ${handwritten[*]}"
          cppcheck --enable=warning,style,performance,portability "${common[@]}" "${handwritten[@]}" || status=1
          echo "::endgroup::"
          echo "::group::CubeMX-generated: ${generated[*]}"
          cppcheck --enable=warning,performance,portability "${common[@]}" "${generated[@]}" || status=1
          echo "::endgroup::"
          exit $status